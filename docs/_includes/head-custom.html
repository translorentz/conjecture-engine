<script>
window.MathJax = {
  tex: {
    inlineMath: [['\\(', '\\)'], ['$', '$']],
    displayMath: [['\\[', '\\]'], ['$$', '$$']],
    processEscapes: true,
    processEnvironments: true,
    macros: {
      SG: '\\mathfrak{S}',
      M: '\\mathcal{M}',
      Li: '\\mathrm{Li}',
      CT: 'C_3',
      ord: '\\operatorname{ord}',
      e: '\\mathrm{e}'
    }
  },
  options: {
    skipHtmlTags: ['script', 'noscript', 'style', 'textarea', 'pre', 'code']
  },
  startup: {
    pageReady: function () {
      // Older kramdown releases emit <script type="math/tex"> instead of
      // \( \) / \[ \]; MathJax 3 does not read those, so unwrap them first.
      var nodes = document.querySelectorAll('script[type^="math/tex"]');
      for (var i = 0; i < nodes.length; i++) {
        var s = nodes[i];
        var display = s.getAttribute('type').indexOf('mode=display') > -1;
        var box = document.createElement(display ? 'div' : 'span');
        box.textContent = display ? '\\[' + s.textContent + '\\]'
                                  : '\\(' + s.textContent + '\\)';
        s.parentNode.replaceChild(box, s);
      }
      return window.MathJax.startup.defaultPageReady();
    }
  }
};
</script>
<script id="MathJax-script" async
        src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
<style>
  /* Wide formulas and tables scroll sideways instead of being cut off on
     narrow (mobile) screens. */
  mjx-container[display="true"] {
    max-width: 100%;
    overflow-x: auto;
    overflow-y: hidden;
    -webkit-overflow-scrolling: touch;   /* momentum scroll on iOS */
    padding-bottom: 0.35em;              /* keep a scrollbar off the glyphs */
  }
  /* A faint scrollbar makes it obvious a wide equation can be swiped sideways. */
  mjx-container[display="true"]::-webkit-scrollbar { height: 4px; }
  mjx-container[display="true"]::-webkit-scrollbar-thumb {
    background: rgba(128,128,128,0.5); border-radius: 2px;
  }
  /* Belt and braces: nothing may force the page wider than the screen, and a
     very wide inline formula (which cannot scroll on its own) makes the content
     column scroll rather than clip at the right edge. */
  .wrapper, section, p, li { max-width: 100%; }
  section { overflow-x: auto; }
  table { display: block; width: fit-content; max-width: 100%; overflow-x: auto; }
</style>
